[workspace]
resolver = "2"
members = [
    "crates/lattice-auth",
    "crates/lattice-config",
    "crates/lattice-telemetry",
    "crates/lattice-federation",
    "crates/lattice-execution",
    "crates/lattice-server",
    "crates/lattice-cache",
    "crates/lattice-rate-limit",
    "crates/lattice-plugin",
    "crates/lattice-connectors",
    "crates/lattice-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/omnidotdev/lattice"
homepage = "https://omni.dev"

[workspace.dependencies]
# Internal crates
lattice-auth = { path = "crates/lattice-auth" }
lattice-config = { path = "crates/lattice-config" }
lattice-telemetry = { path = "crates/lattice-telemetry" }
lattice-federation = { path = "crates/lattice-federation" }
lattice-execution = { path = "crates/lattice-execution" }
lattice-server = { path = "crates/lattice-server" }
lattice-cache = { path = "crates/lattice-cache" }
lattice-rate-limit = { path = "crates/lattice-rate-limit" }
lattice-plugin = { path = "crates/lattice-plugin" }
lattice-connectors = { path = "crates/lattice-connectors" }

# Plugin runtime
extism = "1"

# Cache
deadpool-redis = "0.23"

# JWT
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP server
axum = { version = "0.8", features = ["ws"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Hashing
sha2 = "0.10"
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
thiserror = "2"

# Logging / telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.29"
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.29", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.30"

# Federation
graphql-tools = "0.5"
hive-router-query-planner = "2"

# Protobuf / gRPC connectors
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
tonic = "0.12"
bytes = "1"

# Hot-reload
notify = "7"
arc-swap = "1"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["connect", "rustls-tls-webpki-roots"] }

# HTTP utilities
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Deduplication
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dashmap = "6"

# Testing
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-fmt", "run-cargo-clippy", "run-cargo-test"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
