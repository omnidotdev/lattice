[workspace]
resolver = "2"
members = [
    "crates/lattice-auth",
    "crates/lattice-config",
    "crates/lattice-telemetry",
    "crates/lattice-federation",
    "crates/lattice-execution",
    "crates/lattice-server",
    "crates/lattice-cache",
    "crates/lattice-rate-limit",
    "crates/lattice-gateway",
    "crates/lattice-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/omnidotdev/lattice-gateway"
homepage = "https://omni.dev"

[workspace.dependencies]
# Internal crates
lattice-auth = { path = "crates/lattice-auth" }
lattice-config = { path = "crates/lattice-config" }
lattice-telemetry = { path = "crates/lattice-telemetry" }
lattice-federation = { path = "crates/lattice-federation" }
lattice-execution = { path = "crates/lattice-execution" }
lattice-server = { path = "crates/lattice-server" }
lattice-cache = { path = "crates/lattice-cache" }
lattice-rate-limit = { path = "crates/lattice-rate-limit" }

# Cache
deadpool-redis = "0.23"

# JWT
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
thiserror = "2"

# Logging / telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.29"
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.29", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.30"

# Federation
graphql-tools = "0.5"
hive-router-query-planner = "2"

# HTTP utilities
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# Testing
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-fmt", "run-cargo-clippy", "run-cargo-test"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
