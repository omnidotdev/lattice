[workspace]
resolver = "2"
members = [
    "core/*",
    "core/engine/derive",
    "core/engine/meta-type-name",
    "core/engine/parser",
    "core/engine/query-path",
    "core/engine/registry-for-cache",
    "core/engine/registry-upgrade",
    "core/engine/registry-v2",
    "core/engine/registry-v2-generator",
    "core/engine/response",
    "core/engine/scalars",
    "core/engine/value",
    "core/engine-v2/config",
    "core/engine-v2/axum",
    "core/engine-v2/codegen",
    "core/engine-v2/walker",
    "core/engine-v2/schema",
    "core/engine-v2/query-planning",
    "core/engine-v2/id-derives",
    "core/engine-v2/id-newtypes",
    "core/gateway-v2/auth",
    "core/gateway-v2/auth-config",
    "cli",
    "tools/graph-ref",
    "tools/graphql-lint",
    "tools/gqlint",
]
exclude = [
    "core/gateway-v2",
    "core/wasi-component-loader/examples",
]

# TODO: fork these repos under omnidotdev and update URLs
[patch.crates-io]
# Required: upstream serde_with lacks minify_field_names/minify_variant_names/skip_serializing_defaults
serde_with = { git = "https://github.com/grafbase/serde_with", rev = "06ad277a0e0175c2364d3c065e303a6c8a775c8a" }
# Required: patched OTel to fix tonic version alignment (upgrade otel to >= 0.24 to drop)
opentelemetry = { git = "https://github.com/grafbase/opentelemetry-rust", rev = "f215fe9a391d7d159b9c8a6f8c303d143ba2910f" }
opentelemetry-otlp = { git = "https://github.com/grafbase/opentelemetry-rust", rev = "f215fe9a391d7d159b9c8a6f8c303d143ba2910f" }
opentelemetry-stdout = { git = "https://github.com/grafbase/opentelemetry-rust", rev = "f215fe9a391d7d159b9c8a6f8c303d143ba2910f" }
opentelemetry_sdk = { git = "https://github.com/grafbase/opentelemetry-rust", rev = "f215fe9a391d7d159b9c8a6f8c303d143ba2910f" }
opentelemetry-appender-tracing = { git = "https://github.com/grafbase/opentelemetry-rust", rev = "f215fe9a391d7d159b9c8a6f8c303d143ba2910f" }
# Required: upstream multipart-stream uses http 0.2, codebase uses http 1.x
multipart-stream = { git = "https://github.com/grafbase/multipart-stream-rs-fork", rev = "06ff198e4041c8a8c1c93e580c260d597727c193" }

[workspace.package]
version = "0.80.0"
edition = "2021"
license = "MIT"
homepage = "https://lattice.omni.dev"
keywords = ["lattice", "graphql", "federation", "gateway"]
repository = "https://github.com/omnidotdev/lattice-server"

[workspace.dependencies]
anyhow = "1"
async-graphql = "7.0.3"
async-graphql-axum = "7.0.3"
async-graphql-parser = "7.0.3"
async-graphql-value = "7.0.3"
async-sse = "5"
async-trait = "0.1.80"
async-tungstenite = "0.26.0"
axum = { version = "0.7.6", default-features = false }
axum-server = { version = "0.7", default-features = false }
base64 = "0.22.1"
bitflags = "2.5.0"
bitvec = "1"
blake3 = "1.5.1"
bytes = "1.6.0"
chrono = { version = "0.4.38", default-features = false }
ctor = "0.2.8"
cynic = "=3.7.3"
cynic-introspection = "=3.7.3"
cynic-parser = "0.6.0"
derive_more = "1.0.0-beta.6"
jwt-compact = "0.8"
flexbuffers = "2"
futures = "0.3.30"
futures-channel = "0.3.30"
futures-util = "0.3.30"
handlebars = "6.0.0"
headers = "0.4"
hex = "0.4.3"
http = "1.1.0"
hyper = { version = "1.3.1", features = ["http2"] }
hyper-util = "0.1.3"
indexmap = "2.2.6"
insta = { version = "1.39.0", features = ["json", "redactions"] }
internment = { version = "0.8", features = ["serde", "arc"] }
itertools = "0.13.0"
jsonwebtoken = "9.3.0"
governor = "0.6"
multipart-stream = "0.1.2"
mediatype = "0.19"
num-traits = "0.2.18"
petgraph = "0.6"
pprof = "0.13"
postcard = { version = "1", features = ["use-std"] }
rand = "0.8"
regex = "1.10.4"
reqwest = { version = "0.12.28", default-features = false, features = ["http2"] }
rmp-serde = "1.3.0"
rstest = "0.22"
rustls = { version = "0.23.5", default-features = false }
rustls-pemfile = { version = "2.1.2", default-features = false }
rustls-webpki = { version = "0.102.3", default-features = false }
secrecy = "0.8"
send_wrapper = "0.6"
strum = "0.26.2"
strum_macros = "0.26.2"
tar = "0.4.40"
thiserror = "1.0.59"
tokio = "1.37.0"
tokio-postgres = { version = "0.7.10", default-features = false }
tokio-rustls = { version = "0.26.0", default-features = false }
tokio-tungstenite = { version = "0.23.0", default-features = false }
toml = "0.8"
tungstenite = { version = "0.23.0", default-features = false }
tonic = "0.12.0"
tower = "0.5.0"
tower-http = "0.5.2"
tower-service = "0.3.2"
url = "2.5.0"
uuid = "1.8.0"
ulid = "1.1.2"
wasm-bindgen = "0.2.92"
web-time = "1.1.0"
which = "6.0.1"
wiremock = "0.6.0"
worker = "0.4.0"
fnv = "1.0.7"
sha2 = "0.10.8"

# Serde
serde = { version = "1.0.199", features = ["derive"] }
serde_dynamo = "4.2.14"
serde_json = { version = "1.0.116", features = ["preserve_order"] }
serde_urlencoded = "0.7"
serde-wasm-bindgen = "0.6.5"
serde_with = "3.8.1"

# Tracing
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
tracing-futures = "0.2.5"
tracing-opentelemetry = "0.23"
opentelemetry = "0.22"
opentelemetry_sdk = "0.22.0"
opentelemetry-stdout = "0.3"
opentelemetry-otlp = "0.15"
opentelemetry-appender-tracing = "0.3.0"

# Common
graph-ref = { path = "tools/graph-ref" }
graphql-schema-validation = { path = "core/validation" }
lattice-graphql-introspection = { path = "tools/graphql-introspection" }
graphql-lint = { path = "tools/graphql-lint" }

# Gateway
federated-server = { path = "core/federated-server" }
gateway-config = { path = "core/config" }
rolling-logger = { path = "core/rolling-logger" }

# Engine
async-runtime = { path = "core/async-runtime" }
common-types = { path = "core/common-types" }
dataloader = { path = "core/dataloader", features = ["tracing"] }
engine-config-builder = { path = "core/engine-config-builder" }
engine-parser = { path = "core/engine/parser" }
engine = { path = "core/engine" }
engine-id-newtypes = { path = "core/engine/id-newtypes" }
engine-response = { path = "core/engine/response" }
engine-v2 = { path = "core/engine-v2" }
engine-v2-axum = { path = "core/engine-v2/axum" }
engine-validation = { path = "core/engine/validation" }
engine-value = { path = "core/engine/value" }
federated-graph = { path = "core/federated-graph", package = "graphql-federated-graph" }
gateway-core = { path = "core/gateway-core" }
gateway-v2-auth = { path = "core/gateway-v2/auth" }
gateway-v2-auth-config = { path = "core/gateway-v2/auth-config" }
lattice-telemetry = { path = "core/telemetry" }
graph-entities = { path = "core/graph-entities" }
graphql-composition = { path = "core/composition" }
graphql-cursor = { path = "core/graphql-cursor" }
graphql-extensions = { path = "core/graphql-extensions" }
graphql-mocks = { path = "core/graphql-mocks" }
jwt-verifier = { path = "core/jwt-verifier" }
operation-normalizer = { path = "core/operation-normalizer" }
parser-graphql = { path = "core/parser-graphql" }
parser-sdl = { path = "core/parser-sdl" }
partial-caching = { path = "core/partial-caching" }
query-path = { path = "core/engine/query-path" }
registry-for-cache = { path = "core/engine/registry-for-cache" }
registry-upgrade = { path = "core/engine/registry-upgrade" }
registry-v1 = { path = "core/engine/registry-v1" }
registry-v2 = { path = "core/engine/registry-v2" }
runtime = { path = "core/runtime" }
runtime-local = { path = "core/runtime-local" }
runtime-noop = { path = "core/runtime-noop" }
serde-dynamic-string = { path = "core/serde-dynamic-string" }
wrapping = { path = "core/wrapping", package = "graphql-wrapping-types" }

[profile.bench]
strip = "none"
debug = true

[profile.release]
# by enabling link-time optimization, we can reduce size even further
# by telling cargo to optimize at the link stage (in addition to the
# normal optimizations during the compilation stage)
lto = "thin"

[profile.lambda]
inherits = "release"
opt-level = "s"
codegen-units = 1

[workspace.lints.rust]
nonstandard-style = "deny"
rust-2018-idioms = "deny"
unused-crate-dependencies = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
panic = "deny"

# Opt out of lints that have too many false positives or are yet to be addressed.
bool-to-int-with-if = "allow"
cast-possible-truncation = "allow"
default-trait-access = "allow"
derive-partial-eq-without-eq = "allow"
doc-markdown = "allow"
enum-glob-use = "allow"
implicit-hasher = "allow"
items-after-statements = "allow"
into_iter_without_iter = "allow"
iter_without_into_iter = "allow"
large-digit-groups = "allow"
let-underscore-untyped = "allow"
let-with-type-underscore = "allow"
manual-assert = "allow"
map-unwrap-or = "allow"
match-wildcard-for-single-variants = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"
module-name-repetitions = "allow"
must-use-candidate = "allow"
needless-pass-by-value = "allow"
redundant-closure-for-method-calls = "allow"
single-match-else = "allow"
struct-excessive-bools = "allow"
struct-field-names = "allow"
too-many-lines = "allow"
unnecessary-fallible-conversions = "allow"
unused-async = "allow"
unused-self = "allow"
wildcard-imports = "allow"
