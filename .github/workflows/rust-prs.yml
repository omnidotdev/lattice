name: PR 🧪

on:
  workflow_dispatch:
  pull_request:

env:
  LATTICE_SKIP_ASSET_VERSION_CHECK: 'true'
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: 'always'
  DO_NOT_TRACK: 1
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-rust-pr
  cancel-in-progress: true

jobs:
  what-changed:
    name: Detect changes 🔍
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.paths-changed.outputs.rust }}
      gateway-docker: ${{ steps.paths-changed.outputs.gateway-docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check paths changed
        uses: dorny/paths-filter@v3
        id: paths-changed
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/rust-prs.yml'
            gateway-docker:
              - 'Dockerfile'

  check-format:
    name: Check format 📝
    needs: [what-changed]
    timeout-minutes: 30
    if: needs.what-changed.outputs.rust == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - name: Get sources
        uses: actions/checkout@v6

      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          components: rustfmt

      - name: Check formatting
        shell: bash
        run: |
          cargo fmt --check

  example-component:
    name: Build WASI components 🧩
    if: needs.what-changed.outputs.rust == 'true'
    needs: [what-changed]
    timeout-minutes: 30
    runs-on: ubicloud-standard-8
    steps:
      - name: Get sources
        uses: actions/checkout@v6

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@v1.10.5

      - name: Install cargo-component
        shell: bash
        run: |
          cargo binstall cargo-component --secure -y

      - name: Build WASI components for tests
        shell: bash
        working-directory: core/wasi-component-loader/examples
        run: cargo component build

      - uses: actions/upload-artifact@v4
        with:
          name: example-component
          path: core/wasi-component-loader/examples/target/wasm32-wasip1/debug/*.wasm
          retention-days: 5

  builds:
    name: Build & test 🦀
    needs: [what-changed, example-component]
    timeout-minutes: 60
    if: |
      needs.what-changed.outputs.rust == 'true'
      && !(cancelled())
      && !(contains(needs.*.result, 'failure'))
    strategy:
      fail-fast: false
      matrix:
        platform:
          [
            {
              'target': 'x86_64-unknown-linux-musl',
              'runner': 'ubicloud-standard-8'
            },
            {
              'target': 'aarch64-unknown-linux-musl',
              'runner': 'ubicloud-standard-8-arm'
            },
            {
              'target': 'aarch64-apple-darwin',
              'runner': 'macos-latest-xlarge'
            },
            {
              'target': 'x86_64-apple-darwin',
              'runner': 'macos-latest-xlarge'
            },
            {
              'target': 'x86_64-pc-windows-msvc',
              'runner': 'windows-latest-8-cores'
            }
          ]
    runs-on: ${{ matrix.platform.runner }}
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - name: Get sources
        uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        if: ${{ !startsWith(github.head_ref, 'renovate-') }}
        with:
          cache-provider: ${{ contains(matrix.platform.target, 'linux') && 'buildjet' || 'github' }}

      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          target: ${{ matrix.platform.target }}
          components: clippy, rustfmt

      - name: Install musl-tools
        if: ${{ contains(matrix.platform.target, 'linux') }}
        shell: bash
        run: |
          sudo apt-get install musl musl-tools
          sudo ln -s /bin/g++ /bin/musl-g++
          sudo ln -s /bin/g++ /bin/aarch64-linux-musl-g++

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Enable Corepack before setting up Node
        shell: bash
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        id: pnpm-install
        with:
          version: 8
          run_install: false

      - name: Download pre-built example component
        if: needs.example-component.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: example-component
          path: core/wasi-component-loader/examples/target/wasm32-wasip1/debug

      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Run clippy
        shell: bash
        run: |
          cargo clippy \
            --locked \
            --target ${{ matrix.platform.target }} \
            --workspace

      - name: Log in to Docker Hub
        if: runner.os == 'Linux'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start integration-test docker compose
        if: matrix.platform.target == 'x86_64-unknown-linux-musl'
        shell: bash
        working-directory: core/integration-tests
        run: docker compose up -d

      - name: Start gateway docker compose
        if: matrix.platform.target == 'x86_64-unknown-linux-musl'
        shell: bash
        working-directory: core/gateway-binary
        run: docker compose up -d

      - name: Build tests
        shell: bash
        run: |
          cargo nextest run --target ${{ matrix.platform.target }} --no-run --profile ci --workspace

      - name: Run tests
        id: tests
        shell: bash
        run: |
          cargo nextest run --target ${{ matrix.platform.target }} --profile ci --workspace

      - name: Upload JUnit files
        if: ${{ ( success() || failure() ) && !contains(steps.tests.outputs.exitcode, '101') }}
        uses: ./.github/actions/test_upload_datadog
        with:
          api_key: ${{ secrets.DATADOG_API_KEY }}
          junit_path: target/nextest/ci/junit.xml
          service: cli

  docker-gateway:
    name: Build Docker image 🐳
    needs: [what-changed]
    timeout-minutes: 30
    if: |
      needs.what-changed.outputs.gateway-docker == 'true'
      || needs.what-changed.outputs.rust == 'true'
    runs-on: ubicloud-standard-16
    permissions:
      packages: write
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Get sources
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker pull ghcr.io/omnidotdev/lattice-gateway:latest || true
          docker build -f Dockerfile -t ghcr.io/omnidotdev/lattice-gateway:$COMMIT_SHA .

      - name: Push Docker image
        run: |
          docker push --all-tags ghcr.io/omnidotdev/lattice-gateway

  after-build-rust:
    name: Verify build status 🔍
    needs: [check-format, builds, docker-gateway]
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    if: ${{ always() }}
    steps:
      - name: Check that the builds succeeded
        run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
