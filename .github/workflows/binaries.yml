name: Binaries 🏗️

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'gateway-*'
      - 'lattice-cli-*'

permissions:
  # Allow checks read
  checks: write
  # Allow repo checkout
  contents: write
  # Allow PRs write
  pull-requests: write
  # Allow issues write
  issues: write

env:
  LATTICE_SKIP_ASSET_VERSION_CHECK: 'true'
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: 'always'
  DO_NOT_TRACK: 1
  CLI_RELEASE_CLOUDFLARE_R2_ENDPOINT_URL: https://d267a8ab95268b272f5147e8939c9d38.r2.cloudflarestorage.com
  CLI_RELEASE_CLOUDFLARE_R2_PUBLIC_URL: https://pub-b0013effd6614b32a4fb9bf338b90658.r2.dev
  CLI_RELEASE_CLOUDFLARE_R2_BUCKET_NAME: cli-releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-change-type:
    name: Detect changes 🔍
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build:
              - Dockerfile
              - 'gateway/**/*'
              - 'cli/**/*'
              - 'engine/**/*'
              - '.github/workflows/gateway.yml'
              - '.github/actions/**/*'
              - '!**/*.md'

  lint:
    name: Lint 📝
    needs: [detect-change-type]
    timeout-minutes: 30
    if: ${{ needs.detect-change-type.outputs.build == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubicloud-standard-8
    steps:
      - name: Get sources
        uses: actions/checkout@v4

      - name: Initialize Rust job
        uses: ./.github/actions/init_rust_job
        with:
          platform: linux

      - name: Run lint
        uses: ./.github/actions/lint

  test:
    name: Test 🦀
    needs: [lint]
    timeout-minutes: 60
    if: ${{ needs.detect-change-type.outputs.build == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubicloud-standard-8
    steps:
      - name: Get sources
        uses: actions/checkout@v4

      - name: Initialize Rust job
        uses: ./.github/actions/init_rust_job
        with:
          platform: linux

      - name: Run tests
        uses: ./.github/actions/test
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  individual-builds:
    name: Build individual packages 🔨
    needs: [detect-change-type]
    timeout-minutes: 30
    if: ${{ needs.detect-change-type.outputs.build == 'true' || startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            lattice-cli,
            lattice-gateway,
            federated-server
          ]
    runs-on: ubicloud-standard-8
    steps:
      - name: Get sources
        uses: actions/checkout@v4

      - name: Initialize Rust job
        uses: ./.github/actions/init_rust_job
        with:
          platform: linux

      - name: Build individual package
        shell: bash
        run: |
          set -euo pipefail
          # The actual features used for each dependency depends on what is being built simultaneously.
          # However, each package is published individually, so we're checking that all packages compile
          # with only their defined features.
          # See: https://github.com/rust-lang/cargo/issues/4463
          cargo check --all-features --package ${{ matrix.package }}

      - name: Build individual package without lambda
        if: ${{ matrix.package == 'lattice-gateway' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo check --package ${{ matrix.package }}

  docker-gateway:
    name: Build & push Docker image 🐳
    needs: [test]
    timeout-minutes: 30
    if: ${{ needs.detect-change-type.outputs.build == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubicloud-standard-16
    permissions:
      packages: write
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Get sources
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: |
          # Re-use the latest layers if possible
          docker pull ghcr.io/omnidotdev/lattice-gateway:latest || true
          docker build -f gateway/Dockerfile -t ghcr.io/omnidotdev/lattice-gateway:$COMMIT_SHA .

      - name: Tag latest version
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker tag ghcr.io/omnidotdev/lattice-gateway:$COMMIT_SHA ghcr.io/omnidotdev/lattice-gateway:latest

      - name: Tag released gateway version
        if: ${{ startsWith(github.ref, 'refs/tags') && startsWith(github.ref_name, 'gateway-') }}
        run: |
          docker tag ghcr.io/omnidotdev/lattice-gateway:$COMMIT_SHA ghcr.io/omnidotdev/lattice-gateway:$(echo "$REF" | sed -e "s/^refs\/tags\/gateway-//")
        env:
          REF: ${{ github.ref }}

      - name: Push Docker image
        run: |
          docker push --all-tags ghcr.io/omnidotdev/lattice-gateway

  linux:
    name: Build Linux binaries 🐧
    needs: [test]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        archs:
          [
            {
              runner: ubicloud-standard-8,
              target: x86_64-unknown-linux-musl,
              platform: linux
            },
            {
              runner: ubicloud-standard-8-arm,
              target: aarch64-unknown-linux-musl,
              platform: linux-arm
            }
          ]
    runs-on: ${{ matrix.archs.runner }}
    steps:
      - name: Get sources
        uses: actions/checkout@v4

      - name: Initialize Rust job
        uses: ./.github/actions/init_rust_job
        with:
          platform: ${{ matrix.archs.platform }}

      - name: Install musl
        run: |
          sudo apt update
          sudo apt install musl

      - name: Build lattice-cli release
        run: |
          cd cli
          cargo build --release -p lattice-cli --target ${{ matrix.archs.target }} --timings

      - name: Build lattice-gateway release
        run: |
          cargo build --release -p lattice-gateway --target ${{ matrix.archs.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archs.platform }}-release-timings.html
          path: target/cargo-timings/cargo-timing.html

      - if: ${{ github.event_name == 'pull_request' && matrix.archs.runner != 'ubicloud-standard-8-arm' }}
        name: Upload binaries to R2
        run: |
          aws s3api put-object \
            --endpoint-url $CLI_RELEASE_CLOUDFLARE_R2_ENDPOINT_URL \
            --bucket $CLI_RELEASE_CLOUDFLARE_R2_BUCKET_NAME \
            --key ${GITHUB_SHA}/${{ matrix.archs.target }}/lattice-cli \
            --body target/${{ matrix.archs.target }}/release/lattice-cli

          aws s3api put-object \
            --endpoint-url $CLI_RELEASE_CLOUDFLARE_R2_ENDPOINT_URL \
            --bucket $CLI_RELEASE_CLOUDFLARE_R2_BUCKET_NAME \
            --key ${GITHUB_SHA}/${{ matrix.archs.target }}/lattice-gateway \
            --body target/${{ matrix.archs.target }}/release/lattice-gateway
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_BUCKET_SECRET_ACCESS_KEY }}

      - name: Parse version tag for lattice-cli
        if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'lattice-cli-')
        run: |
          VERSION_BUMP="${{ github.ref_name }}"
          VERSION_BUMP=${VERSION_BUMP//lattice-cli-} # remove the lattice-cli prefix from the tag
          echo VERSION_BUMP=${VERSION_BUMP} >> $GITHUB_ENV

      - name: Parse version tag for gateway
        if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'gateway-')
        run: |
          VERSION_BUMP="${{ github.ref_name }}"
          VERSION_BUMP=${VERSION_BUMP//gateway-} # remove the gateway prefix from the tag
          echo VERSION_BUMP=${VERSION_BUMP} >> $GITHUB_ENV

      - if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'lattice-cli-')
        name: Upload lattice-cli binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VERSION_BUMP }}-${{ matrix.archs.platform }}
          path: |
            target/${{ matrix.archs.target }}/release/lattice-cli

      - if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'gateway-')
        name: Upload gateway binaries
        uses: actions/upload-artifact@v7
        with:
          name: gateway-${{ env.VERSION_BUMP }}-${{ matrix.archs.platform }}
          path: |
            target/${{ matrix.archs.target }}/release/lattice-gateway

      - name: Build gateway lambda release
        shell: bash
        run: |
          BUILD_PROFILE=release
          if [[ $GITHUB_REF =~ ^refs/tags/gateway- ]]; then
            BUILD_PROFILE=lambda
          fi
          echo "Building lambda with $BUILD_PROFILE profile"
          cargo build --profile $BUILD_PROFILE -p lattice-gateway --target ${{ matrix.archs.target }} --features lambda

      - if: ${{ github.event_name == 'pull_request' && matrix.archs.runner != 'ubicloud-standard-8-arm' }}
        name: Upload lambda gateway binary to R2
        run: |
          BUILD_PROFILE=release
          if [[ $GITHUB_REF =~ ^refs/tags/gateway- ]]; then
            BUILD_PROFILE=lambda
          fi
          aws s3api put-object \
            --endpoint-url $CLI_RELEASE_CLOUDFLARE_R2_ENDPOINT_URL \
            --bucket $CLI_RELEASE_CLOUDFLARE_R2_BUCKET_NAME \
            --key ${GITHUB_SHA}/${{ matrix.archs.target }}/lattice-gateway-lambda \
            --body target/${{ matrix.archs.target }}/$BUILD_PROFILE/lattice-gateway
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_BUCKET_SECRET_ACCESS_KEY }}

      - if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'gateway-')
        name: Upload gateway lambda binary
        uses: actions/upload-artifact@v7
        with:
          name: gateway-lambda-${{ env.VERSION_BUMP }}-${{ matrix.archs.platform }}
          path: |
            target/${{ matrix.archs.target }}/lambda/lattice-gateway

  windows:
    name: Build Windows binaries 🪟
    needs: [test]
    timeout-minutes: 60
    runs-on: windows-latest-8-cores
    steps:
      - name: Get sources
        uses: actions/checkout@v4

      - name: Initialize Rust job
        uses: ./.github/actions/init_rust_job
        with:
          platform: windows

      - uses: ilammy/setup-nasm@v1

      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        name: Run tests
        uses: ./.github/actions/test
        with:
          with-integration-tests: 'false'
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

      - name: Build lattice-cli release
        shell: bash
        run: |
          cd cli
          cargo build --release -p lattice-cli --target x86_64-pc-windows-msvc --timings

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release-timings.html
          path: target/cargo-timings/cargo-timing.html

      - name: Parse version tag for lattice-cli
        if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'lattice-cli-')
        shell: bash
        run: |
          VERSION_BUMP="${{ github.ref_name }}"
          VERSION_BUMP=${VERSION_BUMP//lattice-cli-} # remove the lattice-cli prefix from the tag
          echo VERSION_BUMP=${VERSION_BUMP} >> $GITHUB_ENV

      - if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'lattice-cli-')
        name: Upload lattice-cli x86_64-pc-windows-msvc binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VERSION_BUMP }}-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/lattice-cli.exe

  darwin:
    name: Build macOS binaries 🍎
    needs: [test]
    timeout-minutes: 60
    runs-on: macos-latest-xlarge
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Get sources
        uses: actions/checkout@v4

      - name: Initialize Rust job
        uses: ./.github/actions/init_rust_job
        with:
          platform: macos

      - if: ${{ !startsWith(github.ref, 'refs/tags/') && matrix.target == 'x86_64-apple-darwin' }}
        name: Run tests
        uses: ./.github/actions/test
        with:
          with-integration-tests: 'false'
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

      - name: Build lattice-cli ${{ matrix.target }} release
        run: |
          cargo build --release -p lattice-cli --target ${{ matrix.target }} --timings

      - name: Build lattice-gateway ${{ matrix.target }} release
        run: |
          cargo build --release -p lattice-gateway --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-release-timings.html
          path: target/cargo-timings/cargo-timing.html

      - name: Parse version tag for lattice-cli
        if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'lattice-cli-')
        run: |
          VERSION_BUMP="${{ github.ref_name }}"
          VERSION_BUMP=${VERSION_BUMP//lattice-cli-} # remove the lattice-cli prefix from the tag
          echo VERSION_BUMP=${VERSION_BUMP} >> $GITHUB_ENV

      - name: Parse version tag for gateway
        if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'gateway-')
        run: |
          VERSION_BUMP="${{ github.ref_name }}"
          VERSION_BUMP=${VERSION_BUMP//gateway-} # remove the gateway prefix from the tag
          echo VERSION_BUMP=${VERSION_BUMP} >> $GITHUB_ENV

      - if: ${{ github.event_name == 'pull_request' && matrix.archs.runner != 'ubicloud-standard-8-arm' }}
        name: Upload binaries to R2
        run: |
          curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg"
          sudo installer -pkg AWSCLIV2.pkg -target /
          aws s3api put-object \
            --endpoint-url $CLI_RELEASE_CLOUDFLARE_R2_ENDPOINT_URL \
            --bucket $CLI_RELEASE_CLOUDFLARE_R2_BUCKET_NAME \
            --key ${GITHUB_SHA}/${{ matrix.target }}/lattice-cli \
            --body target/${{ matrix.target }}/release/lattice-cli

          aws s3api put-object \
            --endpoint-url $CLI_RELEASE_CLOUDFLARE_R2_ENDPOINT_URL \
            --bucket $CLI_RELEASE_CLOUDFLARE_R2_BUCKET_NAME \
            --key ${GITHUB_SHA}/${{ matrix.target }}/lattice-gateway \
            --body target/${{ matrix.target }}/release/lattice-gateway
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_BUCKET_SECRET_ACCESS_KEY }}

      - if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'lattice-cli-')
        name: Upload lattice-cli ${{ matrix.target }} binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VERSION_BUMP }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/lattice-cli

      - if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'gateway-')
        name: Upload gateway ${{ matrix.target }} binary
        uses: actions/upload-artifact@v7
        with:
          name: gateway-${{ env.VERSION_BUMP }}-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/lattice-gateway

  release-lattice-cli:
    name: Release lattice-cli 🏗️
    needs: [windows, linux, darwin]
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'lattice-cli-')
    uses: ./.github/workflows/cli-release.yml
    with:
      draft: false
      tag: ${{ github.ref_name }}
      prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
    secrets:
      CRATES_ACCESS_TOKEN: ${{ secrets.CRATES_ACCESS_TOKEN }}
      NPM_ACCESS_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
      CLOUDFLARE_ASSETS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ASSETS_ACCOUNT_ID }}
      CLOUDFLARE_ASSETS_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ASSETS_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_ASSETS_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_ASSETS_R2_SECRET_ACCESS_KEY }}

  release-gateway:
    name: Release lattice-gateway 🏗️
    needs: [windows, linux, darwin]
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'gateway-')
    uses: ./.github/workflows/gateway-release.yml
    with:
      draft: false
      tag: ${{ github.ref_name }}
      prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
    secrets:
      CRATES_ACCESS_TOKEN: ${{ secrets.CRATES_ACCESS_TOKEN }}
      NPM_ACCESS_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
      CLOUDFLARE_ASSETS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ASSETS_ACCOUNT_ID }}
      CLOUDFLARE_ASSETS_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ASSETS_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_ASSETS_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_ASSETS_R2_SECRET_ACCESS_KEY }}

  after-build:
    name: Verify build status 🔍
    # This job is responsible for reacting to build success or failure. It must
    # happen after the builds, hence the `needs`. But it must not be skipped
    # when the builds are cancelled or fail (hence the `if: ${{ always() }}`).
    needs: [linux, darwin]
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    if: ${{ always() }}
    steps:
      - name: Check that the builds succeeded
        run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}

      - name: Report release failures
        if: ${{ failure() && startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'lattice-cli-') }}
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: ${{ job.status }}
          notification_title: '({workflow}) lattice-cli release failed'
          message_format: 'Check the link below to see what failed.'
          footer: '<{run_url}|View Run>'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
