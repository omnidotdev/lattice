name: Federation Audit 🧪

on:
  workflow_dispatch:
  pull_request:

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: 'always'
  DO_NOT_TRACK: 1
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  what-changed:
    name: Detect changes 🔍
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    outputs:
      audit: ${{ steps.paths-changed.outputs.audit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check paths changed
        uses: dorny/paths-filter@v3
        id: paths-changed
        with:
          filters: |
            audit:
              - 'core/engine-v2/**'
              - 'core/federation-audit-tests/**'
              - '.github/workflows/federation-audit.yml'

  audit:
    name: Run audit 🦀
    needs: [what-changed]
    timeout-minutes: 30
    if: needs.what-changed.outputs.audit == 'true'
    runs-on: ubicloud-standard-8
    permissions:
      checks: write
      pull-requests: write
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - name: Get sources
        uses: actions/checkout@v4

      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Enable Corepack before setting up Node
        shell: bash
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build audit tests
        shell: bash
        run: |
          cargo nextest run --no-run --profile ci -p federation-audit-tests

      - name: Set up audit test repo
        shell: bash
        run: |
          cargo nextest run --profile ci -p federation-audit-tests --test checkout || true

      - name: Start audit test server
        uses: JarvusInnovations/background-action@v1
        with:
          working-directory: core/federation-audit-tests/gateway-audit-repo
          run: |
            npm start serve
          wait-on: |
            http-get://localhost:4200
          tail: true
          wait-for: 10s
          log-output-if: failure

      - name: Run audit tests
        id: tests
        shell: bash
        continue-on-error: true
        run: |
          cargo nextest run --profile ci -p federation-audit-tests --test audit_tests

      - name: Upload JUnit files
        if: ${{ ( success() || failure() ) && !contains(steps.tests.outputs.exitcode, '101') }}
        uses: ./.github/actions/test_upload_datadog
        with:
          api_key: ${{ secrets.DATADOG_API_KEY }}
          junit_path: target/nextest/ci/junit.xml
          service: audit-tests

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5.0.0-a03
        if: success() || failure()
        with:
          report_paths: 'target/nextest/ci/junit.xml'
          annotate_only: true
          job_name: 'Federation Audit Report'
          check_name: 'Federation Audit Report'
          comment: true
