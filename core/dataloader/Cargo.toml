[package]
name = "dataloader"
description = "A GraphQL dataloader implementation for Lattice"
version = "0.1.0"
edition = "2021"
license = "MIT"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { version = "0.1.80", default-features = false }
fnv.workspace = true
futures-channel = { version = "0.3.30", default-features = false }
futures-timer = { version = "3.0.3", default-features = false, features = ["wasm-bindgen"] }
futures-util = { workspace = true, features = ["io", "sink"] }
lru = { version = "0.12.3", default-features = false }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1.37", features = [
  "macros",
  "sync",
  "time",
] }
async-graphql.workspace = true

[features]
tracing = ["dep:tracing"]
