[workspace]
resolver = "2"
members = [
  "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
homepage = "https://lattice.omni.dev"
keywords = ["lattice", "graphql", "federation", "gateway"]
repository = "https://github.com/omnidotdev/lattice"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
wit-bindgen-rt = { version = "0.28.0", features = ["bitflags"] }

