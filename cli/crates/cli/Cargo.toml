[package]
name = "lattice-cli"
description = "The Lattice command line interface"
categories = ["command-line-utilities"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
backtrace = "0.3.71"
clap = { version = "4.5.4", features = ["cargo", "wrap_help", "derive", "env"] }
clap_complete = "4.5.2"
colored = "2.1.0"
indoc = "2.0.5"
log = "0.4.21"
mimalloc = "0.1.41"
os_type = "2.6.0"
rustls = { workspace = true, features = ["ring", "tls12"] }
serde = "1.0.199"
serde_derive = "1.0.199"
serde_json.workspace = true
strum = { version = "0.26.2", features = ["derive"] }
syntect = { version = "5.2.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing", "dump-load", "dump-create", "html", "yaml-load"] }
thiserror = "1.0.59"
tokio = { version = "1.37.0", features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { version = "1.8.0", features = ["v4"] }

grafbase-graphql-introspection.workspace = true
graphql-lint.workspace = true
graphql-composition.workspace = true
regex = "1"
serde_yaml = "0.9"

[dev-dependencies]
insta = { workspace = true, features = ["json", "redactions", "yaml"] }
tempfile = "3.10.1"
tokio = { version = "1.37.0", features = ["full"] }

[[bin]]
name = "lattice"
path = "src/main.rs"

[features]
default = []

[lints]
workspace = true
